<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>스마트 고객대기실</title>
<style>
:root{--red:#e62d3a;--blue:#1668d9;--navy:#17233b;--muted:#697386;--bg:#f5f7fa;--line:#e5e9ef;--soft:#fff2f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--navy)}
.phone{max-width:520px;min-height:100vh;margin:auto;background:white;box-shadow:0 0 28px #1b2a4014}
.top{padding:18px 20px 14px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #f0f2f5}
.brand{font-size:13px;font-weight:900;color:var(--red)}.step{display:flex;align-items:center;gap:10px;margin-top:10px}.bar{height:6px;background:#edf0f4;border-radius:99px;flex:1;overflow:hidden}.fill{height:100%;background:var(--red);border-radius:99px}.num{font-size:12px;color:#7c8799}
main{padding:25px 20px 36px}.eyebrow{color:var(--red);font-weight:800;font-size:13px}.title{font-size:27px;line-height:1.3;font-weight:900;margin:8px 0}.desc{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:22px}
.grid{display:grid;gap:11px}.btn{appearance:none;width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px;text-align:left;font-size:17px;font-weight:800;color:var(--navy);box-shadow:0 3px 10px #23314d08}
.btn small{display:block;color:#7d8798;font-size:12px;font-weight:600;margin-top:5px}.btn:active{transform:scale(.99)}.btn.red{border-color:#f3b8bd;background:#fff7f7;color:#d92331}.primary{background:var(--red)!important;color:white!important;border-color:var(--red)!important;text-align:center}.ghost{text-align:center;background:#f4f6f8}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--red);margin-right:10px}
.card{border:1px solid var(--line);background:#fbfcfd;border-radius:16px;padding:16px;margin:11px 0}.choice{display:flex;gap:12px;align-items:flex-start}.choice input{width:22px;height:22px;accent-color:var(--red);margin-top:1px}
.badge{display:inline-block;background:var(--soft);color:var(--red);font-weight:800;font-size:12px;padding:6px 9px;border-radius:99px}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:22px}.notice{padding:15px;border-radius:15px;background:#fff6df;color:#725713;font-size:13px;line-height:1.55;margin:14px 0}
.complete{text-align:center;padding-top:10px}.checkmark{width:82px;height:82px;border-radius:50%;background:#ffe9eb;color:var(--red);display:grid;place-items:center;font-size:44px;font-weight:900;margin:0 auto 18px}.wait{background:var(--soft);border-radius:18px;padding:18px;margin:18px 0}.wait strong{font-size:32px;color:var(--red)}
footer{text-align:center;color:#a0a8b5;font-size:10px;padding:18px}
</style>
</head>
<body><div class="phone"><div class="top"><div class="brand">스마트 고객대기실</div><div class="step"><div class="bar"><div id="fill" class="fill"></div></div><div id="num" class="num"></div></div></div><main id="app"></main><footer>※ 2차 시제품: 세부 업무·필요서류는 시연용 예시이며 실제 운영 전 검증이 필요합니다.</footer></div>
<script>
const A=document.getElementById('app'),F=document.getElementById('fill'),N=document.getElementById('num');let hist=[];
function render(step,total,html){F.style.width=(step/total*100)+'%';N.textContent=step+'/'+total;A.innerHTML=html;scrollTo(0,0)}
function push(fn){hist.push(fn)}function back(){const f=hist.pop();if(f)f()}
const act=n=>`<div class="actions"><button class="btn ghost" onclick="back()">이전</button><button class="btn primary" onclick="${n}">다음</button></div>`;
function home(){hist=[];render(1,7,`<div class="eyebrow">상담 전 미리 준비하세요</div><div class="title">어떤 업무로<br>방문하셨나요?</div><div class="desc">방문 목적을 선택하면 필요한 준비사항을 순서대로 안내해 드립니다.</div><div class="grid">
${menu('👥','자격','피부양자, 직장가입자 관리',"qual()")}
${menu('🧾','부과','보험료 산정',"category('부과',['보험료 산정 확인','소득·재산 관련 문의','보험료 조정 문의','기타 부과 상담'])")}
${menu('💳','징수','보험료 징수, 체납 관리',"category('징수',['보험료 납부 문의','체납 보험료 문의','분할납부 상담','기타 징수 상담'])")}
${menu('♡','보험급여','각종 지원금, 환급금 관리',"category('보험급여',['환급금 문의','본인부담 관련 문의','지원금·급여 문의','기타 보험급여 상담'])")}
${menu('♥','건강관리','건강 향상',"category('건강관리',['건강검진 문의','건강증진 서비스','건강관리 상담','기타 건강관리 상담'])")}</div>`)}
function menu(i,t,s,fn){return `<button class="btn" onclick="push(home);${fn}"><span class="icon">${i}</span>${t}<small>${s}</small></button>`}
function qual(){render(2,7,`<span class="badge">자격</span><div class="title">어떤 자격 업무인가요?</div><div class="desc">가장 가까운 항목을 선택해 주세요.</div><div class="grid">
<button class="btn red" onclick="push(qual);relation()">피부양자 등록 (가족)<small>가족을 피부양자로 등록</small></button>
${['피부양자 제외 (가족)','피부양자 자격 확인·상담 (가족)','직장가입자 취득','직장가입자 상실','직장가입자 정보 변경','지역가입자 자격 관련','기타 자격 상담'].map(x=>`<button class="btn" onclick="push(qual);generic('${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function category(name,items){render(2,7,`<span class="badge">${name}</span><div class="title">어떤 ${name} 업무인가요?</div><div class="desc">현재는 전체 서비스 흐름을 확인하기 위한 예시 분류입니다.</div><div class="grid">${items.map(x=>`<button class="btn" onclick="push(()=>category('${name}',${JSON.stringify(items).replace(/"/g,"&quot;")}));generic('${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function generic(name){render(3,7,`<span class="badge">${name}</span><div class="title">방문 유형을 선택해 주세요.</div><div class="grid"><button class="btn red" onclick="push(()=>generic('${name}'));genericDocs('${name}','본인 방문')">본인 방문</button><button class="btn" onclick="push(()=>generic('${name}'));genericDocs('${name}','대리인 방문')">대리인 방문</button></div><div class="notice">이 경로는 2차 시제품의 공통 흐름입니다. 실제 질문과 서류는 업무별로 별도 설계합니다.</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function genericDocs(name,who){render(5,7,`<span class="badge">${name} · ${who}</span><div class="title">준비사항을 확인해 주세요.</div>${check('신분증','방문자 확인용 예시')}${check('업무 관련 신청서','현장 작성 가능 예시')}${check('추가 확인서류','선택한 상황에 따라 달라질 수 있음')}${act(`done('${name}','${who}')`)}`)}
function relation(){render(3,7,`<span class="badge">피부양자 등록 (가족)</span><div class="title">누구를 등록하시나요?</div><div class="desc">가족 관계를 선택해 주세요.</div><div class="grid">${['배우자','부모','자녀','형제·자매','기타 가족'].map(x=>`<button class="btn" onclick="push(relation);visit('${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function visit(rel){render(4,7,`<span class="badge">${rel}</span><div class="title">방문 유형을<br>선택해 주세요.</div><div class="grid"><button class="btn red" onclick="push(()=>visit('${rel}'));situation('${rel}','본인 방문')">본인 방문</button><button class="btn" onclick="push(()=>visit('${rel}'));situation('${rel}','대리인 방문')">대리인 방문</button></div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function situation(rel,who){render(5,7,`<span class="badge">${rel} · ${who}</span><div class="title">현재 상황을<br>확인해 주세요.</div><div class="desc">아래 질문은 기능 확인을 위한 임시 질문입니다.</div>
${yesno('등록하려는 분은 현재 다른 직장가입자가 아닙니까?')}${yesno('가족관계를 확인할 수 있습니까?')}${yesno('추가 확인이 필요한 특별한 사정이 없습니까?')}
${act(`docs('${rel}','${who}')`)}`)}
function yesno(q){return `<div class="card"><b>${q}</b><div style="display:flex;gap:8px;margin-top:12px"><label><input type="radio" name="${q}"> 예</label><label><input type="radio" name="${q}"> 아니오</label></div></div>`}
function docs(rel,who){render(6,7,`<span class="badge">준비서류 안내</span><div class="title">준비하실 서류입니다.</div><div class="desc">현재는 화면 작동 확인용 임시 목록입니다.</div>
${check('신분증','주민등록증·운전면허증 등 예시')}${check('가족관계증명서','가족관계 확인용 예시')}${check('피부양자 관련 신고서','현장 작성 가능 예시')}
<div class="notice">체크하지 않은 서류가 있으면 다음 단계에서 발급·준비 방법을 안내하는 구조로 확장할 수 있습니다.</div>${act(`done('피부양자 등록 (가족)','${who}')`)}`)}
function check(t,s){return `<label class="card choice"><input type="checkbox"><div><b>${t}</b><br><small style="color:#7b8595">${s}</small></div></label>`}
function done(name,who){render(7,7,`<div class="complete"><div class="checkmark">✓</div><div class="title">상담 준비가<br>완료되었습니다!</div><div class="desc">준비하신 서류를 지참하시고 순서가 되면 창구로 이동해 주세요.</div><div class="card" style="text-align:left"><b>선택 업무</b><br>${name}<br><br><b>방문 유형</b><br>${who}</div><div class="wait"><small>예상 대기시간 · 시연용</small><br><strong>약 15분</strong></div><button class="btn primary" onclick="home()">처음으로 돌아가기</button></div>`)}
home();
</script></body></html>
