<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>TEST 스마트 고객대기실 V3</title>
<style>
:root{--red:#e62d3a;--navy:#17233b;--muted:#697386;--bg:#f5f7fa;--line:#e5e9ef;--soft:#fff2f3;--green:#14804a;--amber:#a76b00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--navy)}
.shell{max-width:720px;min-height:100vh;margin:auto;background:white;box-shadow:0 0 28px #1b2a4014}.top{padding:16px 20px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #f0f2f5}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:14px;font-weight:900;color:var(--red)}.mode{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-weight:800;color:var(--navy)}
.step{display:flex;align-items:center;gap:10px;margin-top:10px}.bar{height:6px;background:#edf0f4;border-radius:99px;flex:1;overflow:hidden}.fill{height:100%;background:var(--red);border-radius:99px}.num{font-size:12px;color:#7c8799}
main{padding:25px 20px 36px}.eyebrow{color:var(--red);font-weight:800;font-size:13px}.title{font-size:27px;line-height:1.3;font-weight:900;margin:8px 0}.desc{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:22px}
.grid{display:grid;gap:11px}.btn{appearance:none;width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px;text-align:left;font-size:16px;font-weight:800;color:var(--navy);box-shadow:0 3px 10px #23314d08}.btn small{display:block;color:#7d8798;font-size:12px;font-weight:600;margin-top:5px}.btn:active{transform:scale(.99)}.btn.red{border-color:#f3b8bd;background:#fff7f7;color:#d92331}.primary{background:var(--red)!important;color:white!important;border-color:var(--red)!important;text-align:center}.ghost{text-align:center;background:#f4f6f8}.danger{color:#c8202d}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--red);margin-right:10px}.card{border:1px solid var(--line);background:#fbfcfd;border-radius:16px;padding:16px;margin:11px 0}.choice{display:flex;gap:12px;align-items:flex-start}.choice input{width:22px;height:22px;accent-color:var(--red);margin-top:1px}.badge{display:inline-block;background:var(--soft);color:var(--red);font-weight:800;font-size:12px;padding:6px 9px;border-radius:99px}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:22px}.notice{padding:15px;border-radius:15px;background:#fff6df;color:#725713;font-size:13px;line-height:1.55;margin:14px 0}.complete{text-align:center;padding-top:10px}.checkmark{width:82px;height:82px;border-radius:50%;background:#ffe9eb;color:var(--red);display:grid;place-items:center;font-size:44px;font-weight:900;margin:0 auto 18px}.wait{background:var(--soft);border-radius:18px;padding:18px;margin:18px 0}.wait strong{font-size:32px;color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.kpi{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.kpi small{color:var(--muted)}.kpi b{display:block;font-size:24px;margin-top:5px}.section{font-size:18px;font-weight:900;margin:26px 0 10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.barrow{margin:10px 0}.track{height:9px;background:#eef1f4;border-radius:99px;overflow:hidden;margin-top:6px}.track i{display:block;height:100%;background:var(--red)}.record{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.record .meta{font-size:12px;color:var(--muted);margin:5px 0}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:99px;background:#eef1f4}.status.waiting{color:var(--amber);background:#fff4d8}.status.processing{color:#1668d9;background:#eaf2ff}.status.done{color:var(--green);background:#e9f7ef}.miniActions{display:flex;gap:7px;margin-top:10px}.miniActions button{border:0;border-radius:10px;padding:9px 11px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:25px 5px}.adminNote{font-size:12px;color:var(--muted);line-height:1.55}footer{text-align:center;color:#a0a8b5;font-size:10px;padding:18px}
</style></head>
<body><div class="shell"><div class="top"><div class="brandrow"><div class="brand">TEST 스마트 고객대기실 V3</div><button class="mode" id="modeBtn" onclick="toggleMode()">관리자모드</button></div><div class="step" id="stepWrap"><div class="bar"><div id="fill" class="fill"></div></div><div id="num" class="num"></div></div></div><main id="app"></main><footer>※ TEST 시제품입니다. 업무·서류·통계는 기능 확인용 예시이며 실제 운영 전 별도 검증이 필요합니다.</footer></div>
<script>
const A=document.getElementById('app'),F=document.getElementById('fill'),N=document.getElementById('num'),SW=document.getElementById('stepWrap'),MB=document.getElementById('modeBtn');
let hist=[], current={category:'',service:'',relation:'',visit:'',missing:[]};
const KEY='test_waiting_room_v3_records';
const services={
 '부과':['보험료 산정 확인','소득·재산 관련 문의','보험료 조정 문의','기타 부과 상담'],
 '징수':['보험료 납부 문의','체납 보험료 문의','분할납부 상담','기타 징수 상담'],
 '보험급여':['환급금 문의','본인부담 관련 문의','지원금·급여 문의','기타 보험급여 상담'],
 '건강관리':['건강검진 문의','건강증진 서비스','건강관리 상담','기타 건강관리 상담']
};
function records(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(r){localStorage.setItem(KEY,JSON.stringify(r))}
function render(step,total,html){SW.style.display='flex';F.style.width=(step/total*100)+'%';N.textContent=step+'/'+total;A.innerHTML=html;scrollTo(0,0)}
function push(fn){hist.push(fn)} function back(){const f=hist.pop();if(f)f()}
const act=n=>`<div class="actions"><button class="btn ghost" onclick="back()">이전</button><button class="btn primary" onclick="${n}">다음</button></div>`;
function menu(i,t,s,fn){return `<button class="btn" onclick="current.category='${t}';push(home);${fn}"><span class="icon">${i}</span>${t}<small>${s}</small></button>`}
function home(){hist=[];current={category:'',service:'',relation:'',visit:'',missing:[]};render(1,7,`<div class="eyebrow">상담 전 미리 준비하세요</div><div class="title">어떤 업무로<br>방문하셨나요?</div><div class="desc">방문 목적을 선택하면 필요한 준비사항을 순서대로 안내해 드립니다.</div><div class="grid">
${menu('👥','자격','피부양자, 직장가입자 관리',"qual()")}
${menu('🧾','부과','보험료 산정',"category('부과')")}
${menu('💳','징수','보험료 징수, 체납 관리',"category('징수')")}
${menu('♡','보험급여','각종 지원금, 환급금 관리',"category('보험급여')")}
${menu('♥','건강관리','건강 향상',"category('건강관리')")}</div><div class="notice">고객이 완료한 선택은 이 기기의 TEST 데이터로 저장되어 관리자모드 통계에 반영됩니다.</div>`)}
function qual(){render(2,7,`<span class="badge">자격</span><div class="title">어떤 자격 업무인가요?</div><div class="grid"><button class="btn red" onclick="current.service='피부양자 등록 (가족)';push(qual);relation()">피부양자 등록 (가족)<small>가족을 피부양자로 등록</small></button>${['피부양자 제외 (가족)','피부양자 자격 확인·상담 (가족)','직장가입자 취득','직장가입자 상실','직장가입자 정보 변경','지역가입자 자격 관련','기타 자격 상담'].map(x=>`<button class="btn" onclick="current.service='${x}';push(qual);generic('${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function category(name){render(2,7,`<span class="badge">${name}</span><div class="title">어떤 ${name} 업무인가요?</div><div class="desc">기능 확인을 위한 예시 분류입니다.</div><div class="grid">${services[name].map(x=>`<button class="btn" onclick="current.service='${x}';push(()=>category('${name}'));generic('${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function generic(name){render(3,7,`<span class="badge">${name}</span><div class="title">방문 유형을 선택해 주세요.</div><div class="grid"><button class="btn red" onclick="current.visit='본인 방문';push(()=>generic('${name}'));genericDocs('${name}')">본인 방문</button><button class="btn" onclick="current.visit='대리인 방문';push(()=>generic('${name}'));genericDocs('${name}')">대리인 방문</button></div><div class="notice">실제 질문과 서류는 업무별로 별도 설계해야 합니다.</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function relation(){render(3,7,`<span class="badge">피부양자 등록 (가족)</span><div class="title">누구를 등록하시나요?</div><div class="grid">${['배우자','부모','자녀','형제·자매','기타 가족'].map(x=>`<button class="btn" onclick="current.relation='${x}';push(relation);visit('${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function visit(rel){render(4,7,`<span class="badge">${rel}</span><div class="title">방문 유형을<br>선택해 주세요.</div><div class="grid"><button class="btn red" onclick="current.visit='본인 방문';push(()=>visit('${rel}'));situation('${rel}')">본인 방문</button><button class="btn" onclick="current.visit='대리인 방문';push(()=>visit('${rel}'));situation('${rel}')">대리인 방문</button></div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><span></span></div>`)}
function situation(rel){render(5,7,`<span class="badge">${rel} · ${current.visit}</span><div class="title">현재 상황을<br>확인해 주세요.</div><div class="desc">아래 질문은 기능 확인을 위한 임시 질문입니다.</div>${yesno('q1','등록하려는 분은 현재 다른 직장가입자가 아닙니까?')}${yesno('q2','가족관계를 확인할 수 있습니까?')}${yesno('q3','추가 확인이 필요한 특별한 사정이 없습니까?')}${act(`docs('${rel}')`)}`)}
function yesno(n,q){return `<div class="card"><b>${q}</b><div style="display:flex;gap:12px;margin-top:12px"><label><input type="radio" name="${n}"> 예</label><label><input type="radio" name="${n}"> 아니오</label></div></div>`}
function check(t,s){return `<label class="card choice"><input class="docCheck" type="checkbox" value="${t}" checked><div><b>${t}</b><br><small style="color:#7b8595">${s}</small></div></label>`}
function docs(rel){render(6,7,`<span class="badge">준비서류 안내</span><div class="title">준비하신 서류를<br>체크해 주세요.</div><div class="desc">체크를 해제한 항목은 '미비서류'로 저장됩니다.</div>${check('신분증','방문자 확인용 예시')}${check('가족관계증명서','가족관계 확인용 예시')}${check('피부양자 관련 신고서','현장 작성 가능 예시')}<div class="notice">TEST용 목록입니다.</div>${act(`finishFromDocs()`)}`)}
function genericDocs(name){render(5,7,`<span class="badge">${name} · ${current.visit}</span><div class="title">준비사항을 확인해 주세요.</div><div class="desc">체크를 해제한 항목은 미비서류로 저장됩니다.</div>${check('신분증','방문자 확인용 예시')}${check('업무 관련 신청서','현장 작성 가능 예시')}${check('추가 확인서류','상황에 따라 달라질 수 있음')}${act(`finishFromDocs()`)}`)}
function finishFromDocs(){current.missing=[...document.querySelectorAll('.docCheck')].filter(x=>!x.checked).map(x=>x.value);createRecord()}
function estimate(r){const completed=r.filter(x=>x.status==='완료'&&x.processMinutes>0);const same=completed.filter(x=>x.service===current.service);const pool=same.length?same:completed;const avg=pool.length?pool.reduce((a,x)=>a+x.processMinutes,0)/pool.length:8;const waiting=r.filter(x=>x.status!=='완료').length;return Math.max(3,Math.round(avg*(waiting+1)))}
function createRecord(){let r=records();const now=Date.now(), est=estimate(r);const rec={id:'T'+String(now).slice(-7),createdAt:now,category:current.category||'자격',service:current.service||'피부양자 등록 (가족)',relation:current.relation||'',visit:current.visit||'본인 방문',missing:current.missing,status:'대기',estimatedMinutes:est,startAt:null,endAt:null,waitMinutes:null,processMinutes:null};r.push(rec);save(r);done(rec)}
function done(rec){render(7,7,`<div class="complete"><div class="checkmark">✓</div><div class="title">상담 준비가<br>완료되었습니다!</div><div class="desc">TEST 접수 데이터가 저장되었습니다.</div><div class="card" style="text-align:left"><b>TEST 방문 ID</b><br>${rec.id}<br><br><b>선택 업무</b><br>${rec.service}<br><br><b>방문 유형</b><br>${rec.visit}${rec.missing.length?`<br><br><b>미비서류</b><br>${rec.missing.join(', ')}`:''}</div><div class="wait"><small>데이터 기반 예상 대기시간 · TEST</small><br><strong>약 ${rec.estimatedMinutes}분</strong></div><button class="btn primary" onclick="home()">새 TEST 접수</button></div>`)}
function toggleMode(){
  if(MB.textContent==='관리자모드') adminLogin();
  else logoutAdmin();
}
function adminLogin(){
  SW.style.display='none';
  MB.textContent='고객모드';
  A.innerHTML=`<div class="eyebrow">TEST 관리자 인증</div>
  <div class="title">관리자모드<br>로그인</div>
  <div class="desc">관리자 비밀번호를 입력해 주세요.</div>
  <div class="card">
    <input id="adminPw" type="password" inputmode="numeric" maxlength="4"
      placeholder="비밀번호 4자리"
      style="width:100%;font-size:22px;padding:15px;border:1px solid var(--line);border-radius:12px;text-align:center;letter-spacing:8px">
    <div id="loginMsg" style="color:var(--red);font-size:13px;margin-top:10px;min-height:20px"></div>
  </div>
  <button class="btn primary" onclick="checkAdminPw()">로그인</button>
  <button class="btn ghost" style="margin-top:10px" onclick="logoutAdmin()">고객모드로 돌아가기</button>
  <div class="notice">※ TEST용 인증입니다. 실제 운영 시에는 서버 기반 인증으로 교체해야 합니다.</div>`;
  setTimeout(()=>document.getElementById('adminPw')?.focus(),100);
}
function checkAdminPw(){
  const pw=document.getElementById('adminPw').value;
  if(pw==='1111'){
    sessionStorage.setItem('testAdminAuth','1');
    admin();
  }else{
    document.getElementById('loginMsg').textContent='비밀번호가 올바르지 않습니다.';
    document.getElementById('adminPw').value='';
  }
}
function logoutAdmin(){
  sessionStorage.removeItem('testAdminAuth');
  MB.textContent='관리자모드';
  home();
}
function fmt(ts){return new Date(ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function mins(v){return v==null?'-':Math.round(v)+'분'}
function admin(){if(sessionStorage.getItem('testAdminAuth')!=='1'){adminLogin();return;}MB.textContent='로그아웃';SW.style.display='none';let r=records(), doneR=r.filter(x=>x.status==='완료'), active=r.filter(x=>x.status!=='완료');const avgWait=doneR.length?doneR.reduce((a,x)=>a+(x.waitMinutes||0),0)/doneR.length:0, avgProc=doneR.length?doneR.reduce((a,x)=>a+(x.processMinutes||0),0)/doneR.length:0;
const counts={};r.forEach(x=>counts[x.service]=(counts[x.service]||0)+1);const max=Math.max(1,...Object.values(counts));const missing={};r.forEach(x=>(x.missing||[]).forEach(d=>missing[d]=(missing[d]||0)+1));
A.innerHTML=`<div class="eyebrow">TEST 관리자모드</div><div class="title">실적관리 대시보드</div><div class="desc">이 화면의 수치는 이 기기에서 고객모드로 생성한 TEST 기록을 실시간 집계합니다.</div>
<div class="kpis"><div class="kpi"><small>총 접수</small><b>${r.length}건</b></div><div class="kpi"><small>현재 대기·처리</small><b>${active.length}건</b></div><div class="kpi"><small>평균 실제 대기</small><b>${mins(avgWait)}</b></div><div class="kpi"><small>평균 처리시간</small><b>${mins(avgProc)}</b></div></div>
<div class="section">업무별 이용 비중</div>${Object.keys(counts).length?Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><div class="row"><b>${k}</b><span>${v}건 · ${Math.round(v/r.length*100)}%</span></div><div class="track"><i style="width:${v/max*100}%"></i></div></div>`).join(''):`<div class="empty">아직 저장된 데이터가 없습니다.</div>`}
<div class="section">미비서류</div>${Object.keys(missing).length?Object.entries(missing).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="card row"><b>${k}</b><span>${v}건</span></div>`).join(''):`<div class="card">현재 기록된 미비서류가 없습니다.</div>`}
<div class="section">접수·처리 관리</div>${r.length?r.slice().reverse().map(recordHTML).join(''):`<div class="empty">고객모드에서 TEST 접수를 먼저 만들어보세요.</div>`}
<div class="notice adminNote">현재 V3 데모는 브라우저 localStorage를 사용하므로 같은 기기·브라우저에서 기능을 검증하는 용도입니다. Cloudflare D1 연결 후에는 여러 기기에서 같은 데이터를 공유하도록 바꿀 수 있습니다.</div>
<button class="btn danger" onclick="resetDemo()">TEST 데이터 전체 삭제</button>`;scrollTo(0,0)}
function recordHTML(x){return `<div class="record"><div class="row"><b>${x.service}</b><span class="status ${x.status==='대기'?'waiting':x.status==='처리중'?'processing':'done'}">${x.status}</span></div><div class="meta">${x.id} · ${fmt(x.createdAt)} · ${x.visit}</div>${x.missing?.length?`<div class="meta">미비: ${x.missing.join(', ')}</div>`:''}<div class="meta">예상 ${x.estimatedMinutes}분 · 실제대기 ${mins(x.waitMinutes)} · 처리 ${mins(x.processMinutes)}</div><div class="miniActions">${x.status==='대기'?`<button onclick="start('${x.id}')">처리 시작</button>`:''}${x.status==='처리중'?`<button onclick="complete('${x.id}')">처리 완료</button>`:''}</div></div>`}
function start(id){let r=records(),x=r.find(v=>v.id===id);if(!x)return;x.status='처리중';x.startAt=Date.now();x.waitMinutes=(x.startAt-x.createdAt)/60000;save(r);admin()}
function complete(id){let r=records(),x=r.find(v=>v.id===id);if(!x)return;x.status='완료';x.endAt=Date.now();x.processMinutes=Math.max(0.1,(x.endAt-x.startAt)/60000);save(r);admin()}
function resetDemo(){if(confirm('이 기기에 저장된 TEST 데이터를 모두 삭제할까요?')){localStorage.removeItem(KEY);admin()}}
home();
</script></body></html>
